name: Bilink
options:
  bundleIdPrefix: com.remoteharness
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Bilink:
    type: application
    platform: iOS
    sources:
      - Bilink
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remoteharness.bilink
        PRODUCT_NAME: Bilink
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接局域网内的远程桥需要访问本地网络
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: true
